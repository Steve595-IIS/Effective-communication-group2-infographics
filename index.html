<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INFOGRAPHICS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #02050e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* --- Neon Blue Animated Background Layers --- */
    .ambient-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .orb-top {
      top: -140px;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 520px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.32) 0%, rgba(14, 165, 233, 0.16) 45%, transparent 70%);
      filter: blur(120px);
      animation: pulseSlow 10s ease-in-out infinite;
    }

    .orb-center {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 550px;
      height: 360px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.18) 0%, transparent 70%);
      filter: blur(110px);
    }

    .orb-bottom {
      bottom: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 1100px;
      height: 550px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.25) 0%, rgba(2, 132, 199, 0.14) 50%, transparent 70%);
      filter: blur(130px);
      animation: pulseReverse 12s ease-in-out infinite;
    }

    .orb-left {
      top: 25%;
      left: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, transparent 70%);
      filter: blur(130px);
    }

    .orb-right {
      top: 30%;
      right: -200px;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.22) 0%, transparent 70%);
      filter: blur(130px);
    }

    .neon-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.07) 1px, transparent 1px);
      background-size: 42px 42px;
      opacity: 0.6;
    }

    #mouseGlow {
      position: fixed;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.16) 0%, rgba(14, 165, 233, 0.06) 40%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      transform: translate(-1000px, -1000px);
      transition: transform 0.075s ease-out;
      z-index: 1;
    }

    #bgCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .horizon-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.6) 50%, transparent);
      box-shadow: 0 0 14px #00f0ff;
      pointer-events: none;
      z-index: 3;
    }

    .horizon-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.45) 50%, transparent);
      box-shadow: 0 0 12px #00f0ff;
      pointer-events: none;
      z-index: 3;
    }

    @keyframes pulseSlow {
      0%, 100% { opacity: 0.55; transform: translateX(-50%) scale(1); }
      50% { opacity: 0.85; transform: translateX(-50%) scale(1.08); }
    }

    @keyframes pulseReverse {
      0%, 100% { opacity: 0.65; transform: translateX(-50%) scale(1.04); }
      50% { opacity: 0.4; transform: translateX(-50%) scale(0.96); }
    }

    /* --- Glowing Title Styles --- */
    .title-container {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 25;
      pointer-events: none;
      text-align: center;
      width: 100%;
    }

    .glowing-title {
      font-family: 'Orbitron', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: clamp(2rem, 4.4vw, 3.4rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #f0f9ff 0%, #bae6fd 35%, #7dd3fc 65%, #38bdf8 88%, #0284c7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(224, 242, 254, 0.9)) drop-shadow(0 0 22px rgba(56, 189, 248, 0.65)) drop-shadow(0 0 45px rgba(14, 165, 233, 0.4));
      margin: 0;
      line-height: 1.1;
    }

    .title-underline-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
      width: clamp(140px, 20vw, 240px);
    }

    .underline-line {
      flex: 1;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.8) 60%, #e0f2fe 100%);
      box-shadow: 0 0 8px #38bdf8;
    }

    .underline-line.right {
      background: linear-gradient(90deg, #e0f2fe 0%, rgba(56, 189, 248, 0.8) 40%, transparent 100%);
    }

    .underline-diamond {
      width: 6px;
      height: 6px;
      transform: rotate(45deg);
      background: #e0f2fe;
      box-shadow: 0 0 8px #ffffff, 0 0 16px #7dd3fc, 0 0 24px #38bdf8;
    }

    /* --- Infographic Presentation Stage --- */
    .infographic-stage {
      position: absolute;
      top: 92px;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      height: calc(100% - 114px);
      width: auto;
      max-width: min(85vw, 470px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      pointer-events: auto;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .infographic-stage.is-expanded {
      top: 14px;
      bottom: 14px;
      height: calc(100% - 28px);
      max-width: min(92vw, 820px);
      z-index: 70;
    }

    /* The Frame containing the image */
    .infographic-frame {
      position: relative;
      height: 100%;
      max-height: 100%;
      width: auto;
      aspect-ratio: 700 / 990;
      max-width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: rgba(3, 11, 24, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.45);
      box-shadow: 
        0 0 35px rgba(0, 240, 255, 0.22),
        0 20px 45px rgba(0, 0, 0, 0.85),
        inset 0 0 25px rgba(0, 240, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: visible;
      touch-action: none;
    }

    .zoom-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 15px;
      cursor: grab;
    }

    .zoom-viewport.is-dragging {
      cursor: grabbing !important;
    }

    .zoom-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      will-change: transform;
      transition: transform 0.05s linear;
    }

    .zoom-content.is-animating {
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .infographic-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.75));
      pointer-events: none;
    }

    /* HUD Tech Corner Brackets */
    .corner-bracket {
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: #00f0ff;
      border-style: solid;
      pointer-events: none;
      filter: drop-shadow(0 0 8px #00f0ff);
      z-index: 15;
    }

    .corner-tl {
      top: -1px;
      left: -1px;
      border-width: 2.5px 0 0 2.5px;
      border-top-left-radius: 16px;
    }

    .corner-tr {
      top: -1px;
      right: -1px;
      border-width: 2.5px 2.5px 0 0;
      border-top-right-radius: 16px;
    }

    .corner-bl {
      bottom: -1px;
      left: -1px;
      border-width: 0 0 2.5px 2.5px;
      border-bottom-left-radius: 16px;
    }

    .corner-br {
      bottom: -1px;
      right: -1px;
      border-width: 0 2.5px 2.5px 0;
      border-bottom-right-radius: 16px;
    }

    .scanline {
      position: absolute;
      inset: 0;
      border-radius: 15px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        transparent 50%,
        rgba(0, 240, 255, 0.035) 51%
      );
      background-size: 100% 4px;
      opacity: 0.55;
      z-index: 12;
    }

    /* Options / Controls on TOP RIGHT OUT of the image, VERTICAL (No Text) */
    .hud-controls {
      position: absolute;
      top: 6px;
      left: calc(100% + 12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      padding: 7px 6px;
      background: rgba(3, 11, 24, 0.88);
      border: 1px solid rgba(0, 240, 255, 0.45);
      border-radius: 22px;
      box-shadow: 
        0 0 18px rgba(0, 240, 255, 0.25),
        0 8px 24px rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 35;
      pointer-events: auto;
    }

    .hud-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.35);
      color: #00f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.18);
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      padding: 0;
    }

    .hud-btn:hover {
      background: rgba(0, 240, 255, 0.3);
      border-color: #00f0ff;
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.8);
      transform: scale(1.12);
      color: #ffffff;
    }

    .hud-btn:active {
      transform: scale(0.92);
    }

    .hud-btn svg {
      width: 15px;
      height: 15px;
      stroke-width: 2.2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (max-width: 900px) {
      .infographic-stage {
        top: 86px;
        bottom: 76px;
        height: calc(100% - 162px);
        max-width: min(calc(100vw - 72px), 380px);
        transform: translateX(calc(-50% - 14px));
      }
      .infographic-stage.is-expanded {
        max-width: min(calc(100vw - 64px), 680px);
        transform: translateX(calc(-50% - 14px));
      }
      .robot-anchor {
        width: clamp(120px, 20vw, 150px) !important;
      }
      .hud-controls {
        top: 4px;
        left: calc(100% + 8px);
        padding: 5px 4px;
        gap: 6px;
      }
      .hud-btn {
        width: 28px;
        height: 28px;
      }
      .hud-btn svg {
        width: 13px;
        height: 13px;
      }
    }

    /* --- Robot & Speech Bubble Styles --- */
    @keyframes robotLevitate {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(0.35deg); }
    }

    .robot-anchor {
      position: fixed;
      right: 14px;
      bottom: 0;
      z-index: 50;
      width: clamp(160px, 16vw, 240px);
      pointer-events: auto;
      transition: opacity 0.3s ease;
    }

    .infographic-stage.is-expanded ~ .robot-anchor {
      opacity: 0.15;
      pointer-events: none;
    }

    /* Speech Bubble with Centered Arrow */
    .speech-bubble {
      position: absolute;
      bottom: 78%;
      left: 50%;
      transform: translateX(-50%) scale(0.88);
      margin-bottom: 8px;
      width: clamp(180px, 20vw, 215px);
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(3, 9, 20, 0.94);
      border: 1px solid rgba(0, 240, 255, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.35);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: bottom center;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
    }

    .speech-bubble.active {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: auto;
    }

    /* Arrow in the MIDDLE of speech bubble */
    .speech-bubble-tail {
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 13px;
      height: 13px;
      background: rgba(3, 9, 20, 0.94);
      border-right: 1px solid rgba(0, 240, 255, 0.5);
      border-bottom: 1px solid rgba(0, 240, 255, 0.5);
    }

    .speech-title {
      font-size: 14px;
      font-weight: 600;
      color: #e0faff;
      text-align: center;
      letter-spacing: 0.03em;
      margin-bottom: 12px;
      text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-yes {
      flex: 1;
      display: inline-block;
      text-decoration: none;
      text-align: center;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 8px;
      color: #00ff66;
      background: rgba(0, 255, 102, 0.12);
      border: 1px solid #00ff66;
      box-shadow: 0 0 14px rgba(0, 255, 102, 0.55), inset 0 0 8px rgba(0, 255, 102, 0.2);
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .btn-yes:hover {
      background: rgba(0, 255, 102, 0.28);
      box-shadow: 0 0 22px rgba(0, 255, 102, 0.95), inset 0 0 12px rgba(0, 255, 102, 0.35);
      transform: translateY(-1px);
    }

    .btn-no {
      flex: 1;
      display: inline-block;
      text-align: center;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 8px;
      color: #ff0055;
      background: rgba(255, 0, 85, 0.12);
      border: 1px solid #ff0055;
      box-shadow: 0 0 14px rgba(255, 0, 85, 0.55), inset 0 0 8px rgba(255, 0, 85, 0.2);
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.8);
      transition: all 0.15s ease;
      cursor: pointer;
      outline: none;
    }

    .btn-no:hover {
      background: rgba(255, 0, 85, 0.28);
      box-shadow: 0 0 22px rgba(255, 0, 85, 0.95), inset 0 0 12px rgba(255, 0, 85, 0.35);
      transform: translateY(-1px);
    }

    .robot-container {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      transform: translateY(10%);
      cursor: pointer;
    }

    .robot-levitate {
      position: relative;
      width: 100%;
      animation: robotLevitate 5s ease-in-out infinite;
    }

    .robot-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 819 / 1024;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 76%, rgba(0, 0, 0, 0) 96%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 1) 76%, rgba(0, 0, 0, 0) 96%);
    }

    .robot-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: top;
      filter: contrast(1.05) drop-shadow(0 20px 45px rgba(0, 0, 0, 0.95));
      pointer-events: none;
    }

    .visor-clip {
      clip-path: polygon(24% 14%, 67% 12%, 75% 36%, 60% 49%, 27% 46%, 20% 30%);
      -webkit-clip-path: polygon(24% 14%, 67% 12%, 75% 36%, 60% 49%, 27% 46%, 20% 30%);
    }

    .visor-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .eyes-wrapper {
      position: absolute;
      left: 32.8%;
      top: 28.2%;
      width: 25.4%;
      height: 11.3%;
      transform-origin: center;
      transition: transform 0.075s ease-out;
    }

    #eyesCanvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 10px #00f0ff) brightness(1.25);
    }

    .visor-sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.3;
      mix-blend-mode: screen;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, transparent 40%, rgba(0, 240, 255, 0.2) 100%);
    }
  </style>
</head>
<body id="pageBody">
  <!-- 1. Ambient Volumetric Light Blooms -->
  <div class="ambient-container">
    <div class="glow-orb orb-top"></div>
    <div class="glow-orb orb-center"></div>
    <div class="glow-orb orb-bottom"></div>
    <div class="glow-orb orb-left"></div>
    <div class="glow-orb orb-right"></div>
  </div>

  <!-- 2. Cybernetic Neon Grid Overlay -->
  <div class="neon-grid"></div>

  <!-- 3. Interactive Mouse Glow Aura -->
  <div id="mouseGlow"></div>

  <!-- 4. Constellation Star Canvas -->
  <canvas id="bgCanvas"></canvas>

  <!-- 5. Glowing Horizon Hairlines -->
  <div class="horizon-top"></div>
  <div class="horizon-bottom"></div>

  <!-- Glowing Title on Top -->
  <div class="title-container">
    <h1 class="glowing-title">INFOGRAPHICS</h1>
    <div class="title-underline-wrapper">
      <span class="underline-line left"></span>
      <span class="underline-diamond"></span>
      <span class="underline-line right"></span>
    </div>
  </div>

  <!-- Interactive Zoomable Infographic Stage -->
  <main class="infographic-stage" id="infographicStage">
    <div class="infographic-frame" id="infographicFrame">
      <div class="corner-bracket corner-tl"></div>
      <div class="corner-bracket corner-tr"></div>
      <div class="corner-bracket corner-bl"></div>
      <div class="corner-bracket corner-br"></div>
      <div class="scanline"></div>

      <!-- Options / Controls on the TOP RIGHT OUT of the Image (No Text) -->
      <div class="hud-controls" id="hudControls">
        <button type="button" class="hud-btn" id="btnZoomIn" aria-label="Zoom in">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button type="button" class="hud-btn" id="btnZoomOut" aria-label="Zoom out">
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button type="button" class="hud-btn" id="btnReset" aria-label="Reset zoom">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
        </button>
        <button type="button" class="hud-btn" id="btnExpand" aria-label="Toggle size">
          <svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
        </button>
      </div>

      <!-- Zoom and Pan Viewport -->
      <div class="zoom-viewport" id="zoomViewport">
        <div class="zoom-content" id="zoomContent">
          <img
            src="https://i.imgur.com/bHVcPZG.png"
            alt="INFOGRAPHICS"
            class="infographic-image"
            id="infographicImage"
            draggable="false"
          />
        </div>
      </div>
    </div>
  </main>

  <!-- 6. Robot Anchor & Centered Arrow Speech Bubble -->
  <div class="robot-anchor">
    <div id="speechBubble" class="speech-bubble">
      <!-- Arrow in the middle -->
      <div class="speech-bubble-tail"></div>
      <p class="speech-title">Wanna go back?</p>
      <div class="btn-group">
        <a
          href="https://steve595-iis.github.io/Effective-communication-group2-globe/"
          target="_self"
          rel="noopener noreferrer"
          class="btn-yes"
        >
          Yes
        </a>
        <button id="btnNo" type="button" class="btn-no">
          No
        </button>
      </div>
    </div>

    <!-- Floating Robot -->
    <div id="robotContainer" class="robot-container">
      <div class="robot-levitate">
        <div class="robot-stage">
          <img
            src="https://i.imgur.com/pBb5wl3.png"
            alt="Eye Tracking Robot"
            class="robot-image"
            draggable="false"
          />

          <div class="visor-layer visor-clip">
            <div id="eyesWrapper" class="eyes-wrapper">
              <canvas id="eyesCanvas" width="260" height="145"></canvas>
            </div>
          </div>

          <div class="visor-sheen visor-clip"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- 1. Draw glowing LED eye matrix ---
    const eyesCanvas = document.getElementById('eyesCanvas');
    const eyeCtx = eyesCanvas.getContext('2d');

    function drawEyes() {
      eyeCtx.clearRect(0, 0, 260, 145);
      const leftEye = { x: 62, y: 81, r: 48 };
      const rightEye = { x: 195, y: 62, r: 50 };

      [leftEye, rightEye].forEach((c) => {
        eyeCtx.save();
        eyeCtx.beginPath();
        eyeCtx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        eyeCtx.clip();

        eyeCtx.translate(c.x, c.y);
        eyeCtx.rotate((-10 * Math.PI) / 180);
        eyeCtx.translate(-c.x, -c.y);

        const spacing = 5.4;
        for (let gx = c.x - c.r - 10; gx <= c.x + c.r + 10; gx += spacing) {
          for (let gy = c.y - c.r - 10; gy <= c.y + c.r + 10; gy += spacing) {
            const d = Math.hypot(gx - c.x, gy - c.y);
            if (d < c.r) {
              const alpha = Math.max(0.7, 1 - Math.pow(d / c.r, 3));
              eyeCtx.beginPath();
              eyeCtx.arc(gx, gy, 2.05, 0, Math.PI * 2);
              eyeCtx.fillStyle = `rgba(0, 240, 255, ${alpha})`;
              eyeCtx.shadowColor = '#00f0ff';
              eyeCtx.shadowBlur = 7;
              eyeCtx.fill();

              if (d < c.r * 0.85) {
                eyeCtx.beginPath();
                eyeCtx.arc(gx, gy, 1.2, 0, Math.PI * 2);
                eyeCtx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.98})`;
                eyeCtx.shadowColor = '#ffffff';
                eyeCtx.shadowBlur = 5;
                eyeCtx.fill();
              }
            }
          }
        }
        eyeCtx.restore();
      });
    }
    drawEyes();

    // --- 2. Living Constellation Background ---
    const bgCanvas = document.getElementById('bgCanvas');
    const bgCtx = bgCanvas.getContext('2d');
    let width = (bgCanvas.width = window.innerWidth);
    let height = (bgCanvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = bgCanvas.width = window.innerWidth;
      height = bgCanvas.height = window.innerHeight;
    });

    const particles = Array.from({ length: 65 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      radius: Math.random() < 0.25 ? Math.random() * 2 + 1.2 : Math.random() * 1.1 + 0.6,
      color: Math.random() < 0.35 ? '#ffffff' : '#00f0ff',
      alpha: Math.random() * 0.6 + 0.25,
      alphaSpeed: (Math.random() - 0.5) * 0.012,
    }));

    function renderBg() {
      bgCtx.clearRect(0, 0, width, height);

      // Connecting filaments
      const pLen = particles.length;
      for (let i = 0; i < pLen; i++) {
        for (let j = i + 1; j < pLen; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.hypot(dx, dy);

          if (dist < 125) {
            const lineAlpha = (1 - dist / 125) * 0.2 * Math.min(particles[i].alpha, particles[j].alpha);
            bgCtx.strokeStyle = `rgba(0, 240, 255, ${lineAlpha})`;
            bgCtx.lineWidth = 0.75;
            bgCtx.beginPath();
            bgCtx.moveTo(particles[i].x, particles[i].y);
            bgCtx.lineTo(particles[j].x, particles[j].y);
            bgCtx.stroke();
          }
        }
      }

      // Stars
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha += p.alphaSpeed;
        if (p.alpha <= 0.15 || p.alpha >= 0.85) p.alphaSpeed = -p.alphaSpeed;
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;
        if (p.y < 0) p.y = height;
        if (p.y > height) p.y = 0;

        bgCtx.save();
        bgCtx.shadowBlur = p.color === '#ffffff' ? 12 : 10;
        bgCtx.shadowColor = p.color === '#ffffff' ? 'rgba(255, 255, 255, 0.9)' : 'rgba(0, 240, 255, 0.85)';
        bgCtx.fillStyle = p.color === '#ffffff' ? `rgba(255, 255, 255, ${p.alpha})` : `rgba(0, 240, 255, ${p.alpha})`;
        bgCtx.beginPath();
        bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        bgCtx.fill();
        bgCtx.restore();
      }

      requestAnimationFrame(renderBg);
    }
    renderBg();

    // --- 3. Pointer Tracking & Mouse Follower ---
    const mouseGlow = document.getElementById('mouseGlow');
    const robotContainer = document.getElementById('robotContainer');
    const eyesWrapper = document.getElementById('eyesWrapper');
    const speechBubble = document.getElementById('speechBubble');
    const btnNo = document.getElementById('btnNo');
    const pageBody = document.getElementById('pageBody');

    let currentNormX = 0;
    let currentNormY = -0.25;
    let isBlinking = false;
    let isExcited = false;
    let showBubble = false;

    function applyTransforms() {
      const offsetXPercent = currentNormX * 16.5;
      const offsetYPercent = currentNormY < 0 ? currentNormY * 18 : currentNormY * 11;
      const scaleX = isBlinking ? 1.06 : isExcited ? 1.14 : 1;
      const scaleY = isBlinking ? 0.08 : isExcited ? 1.14 : 1;

      eyesWrapper.style.transform = `translate3d(${offsetXPercent}%, ${offsetYPercent}%, 0) scale(${scaleX}, ${scaleY})`;
    }

    function handlePointer(clientX, clientY) {
      mouseGlow.style.transform = `translate3d(${clientX - 220}px, ${clientY - 220}px, 0)`;

      const rect = robotContainer.getBoundingClientRect();
      const faceCenterX = rect.left + rect.width * 0.48;
      const baselineY = rect.top + rect.height * 0.35;

      const reachX = Math.max(window.innerWidth * 0.58, 300);
      const reachTop = Math.max(baselineY * 0.85, 180);
      const reachBottom = Math.max((window.innerHeight - baselineY) * 0.85, 100);

      const dx = clientX - faceCenterX;
      const dy = clientY - baselineY;

      currentNormX = Math.max(-1, Math.min(1, dx / reachX));
      currentNormY = Math.max(-1, Math.min(1, dy < 0 ? dy / reachTop : dy / reachBottom));
      applyTransforms();
    }

    window.addEventListener('mousemove', (e) => handlePointer(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    // --- 4. Natural Blinking Loop ---
    function scheduleBlink() {
      const delay = Math.random() * 3200 + 2600;
      setTimeout(() => {
        isBlinking = true;
        applyTransforms();
        setTimeout(() => {
          isBlinking = false;
          applyTransforms();

          if (Math.random() > 0.65) {
            setTimeout(() => {
              isBlinking = true;
              applyTransforms();
              setTimeout(() => {
                isBlinking = false;
                applyTransforms();
                scheduleBlink();
              }, 120);
            }, 100);
          } else {
            scheduleBlink();
          }
        }, 140);
      }, delay);
    }
    scheduleBlink();
    applyTransforms();

    // --- 5. Interactive Click & Speech Bubble ---
    function setBubbleVisibility(visible) {
      showBubble = visible;
      if (showBubble) {
        speechBubble.classList.add('active');
      } else {
        speechBubble.classList.remove('active');
      }
    }

    robotContainer.addEventListener('click', (e) => {
      e.stopPropagation();
      setBubbleVisibility(!showBubble);

      isExcited = true;
      applyTransforms();
      setTimeout(() => {
        isExcited = false;
        applyTransforms();
      }, 450);
    });

    btnNo.addEventListener('click', (e) => {
      e.stopPropagation();
      setBubbleVisibility(false);
    });

    speechBubble.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    pageBody.addEventListener('click', () => {
      if (showBubble) setBubbleVisibility(false);
    });

    // --- 6. Comprehensive Image Zoom & Pan Engine ---
    const infographicStage = document.getElementById('infographicStage');
    const zoomViewport = document.getElementById('zoomViewport');
    const zoomContent = document.getElementById('zoomContent');
    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const btnReset = document.getElementById('btnReset');
    const btnExpand = document.getElementById('btnExpand');

    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startPointerX = 0;
    let startPointerY = 0;
    let initialPinchDist = 0;
    let initialPinchScale = 1;

    function updateZoomStyle(animated = false) {
      if (animated) {
        zoomContent.classList.add('is-animating');
        setTimeout(() => zoomContent.classList.remove('is-animating'), 290);
      } else {
        zoomContent.classList.remove('is-animating');
      }

      zoomContent.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;
      zoomViewport.style.cursor = scale > 1.05 ? 'grab' : 'default';
    }

    function clampBounds() {
      if (scale <= 1) {
        translateX = 0;
        translateY = 0;
        return;
      }
      const vpRect = zoomViewport.getBoundingClientRect();
      const maxTransX = (vpRect.width * (scale - 1)) / 1.8;
      const maxTransY = (vpRect.height * (scale - 1)) / 1.8;

      translateX = Math.max(-maxTransX, Math.min(maxTransX, translateX));
      translateY = Math.max(-maxTransY, Math.min(maxTransY, translateY));
    }

    function setZoom(newScale, focalX, focalY, animated = false) {
      const prevScale = scale;
      scale = Math.max(1, Math.min(4.5, newScale));

      if (scale === 1) {
        translateX = 0;
        translateY = 0;
      } else if (focalX !== undefined && focalY !== undefined) {
        const vpRect = zoomViewport.getBoundingClientRect();
        const centerRelX = focalX - vpRect.left - vpRect.width / 2;
        const centerRelY = focalY - vpRect.top - vpRect.height / 2;
        const ratio = scale / prevScale;

        translateX = centerRelX - (centerRelX - translateX) * ratio;
        translateY = centerRelY - (centerRelY - translateY) * ratio;
      }

      clampBounds();
      updateZoomStyle(animated);
    }

    // Zoom Buttons
    btnZoomIn.addEventListener('click', (e) => {
      e.stopPropagation();
      setZoom(scale * 1.35, undefined, undefined, true);
    });

    btnZoomOut.addEventListener('click', (e) => {
      e.stopPropagation();
      setZoom(scale / 1.35, undefined, undefined, true);
    });

    btnReset.addEventListener('click', (e) => {
      e.stopPropagation();
      setZoom(1, undefined, undefined, true);
    });

    btnExpand.addEventListener('click', (e) => {
      e.stopPropagation();
      infographicStage.classList.toggle('is-expanded');
      setTimeout(() => {
        clampBounds();
        updateZoomStyle(true);
      }, 150);
    });

    // Mouse Wheel Zoom centered on cursor
    zoomViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.18 : 0.85;
      setZoom(scale * zoomFactor, e.clientX, e.clientY, false);
    }, { passive: false });

    // Double-click to toggle zoom (1x <-> 2.4x)
    zoomViewport.addEventListener('dblclick', (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (scale > 1.25) {
        setZoom(1, undefined, undefined, true);
      } else {
        setZoom(2.4, e.clientX, e.clientY, true);
      }
    });

    // Pointer Drag Panning
    zoomViewport.addEventListener('pointerdown', (e) => {
      if (scale <= 1.02 && e.button !== 0) return;
      isDragging = true;
      startPointerX = e.clientX - translateX;
      startPointerY = e.clientY - translateY;
      zoomViewport.setPointerCapture(e.pointerId);
      zoomViewport.classList.add('is-dragging');
    });

    zoomViewport.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startPointerX;
      translateY = e.clientY - startPointerY;
      clampBounds();
      updateZoomStyle(false);
    });

    const endDrag = (e) => {
      if (isDragging) {
        isDragging = false;
        try {
          zoomViewport.releasePointerCapture(e.pointerId);
        } catch (_) {}
        zoomViewport.classList.remove('is-dragging');
      }
    };

    zoomViewport.addEventListener('pointerup', endDrag);
    zoomViewport.addEventListener('pointercancel', endDrag);

    // Touch Pinch-to-zoom
    zoomViewport.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialPinchScale = scale;
      }
    }, { passive: true });

    zoomViewport.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist > 0) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const newScale = initialPinchScale * (dist / initialPinchDist);
        setZoom(newScale, midX, midY, false);
      }
    }, { passive: true });

    zoomViewport.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDist = 0;
      }
    }, { passive: true });
  </script>
</body>
</html>
